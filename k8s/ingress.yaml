apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: acquisitions-ingress
  labels:
    app: acquisitions
spec:
  # K3s mặc định cài sẵn Traefik Ingress Controller
  ingressClassName: traefik
  rules:
    - host: app.34.136.218.3.nip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: acquisitions-service
                port:
                  number: 8080
