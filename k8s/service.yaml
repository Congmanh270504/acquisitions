apiVersion: v1
kind: Service
metadata:
  name: acquisitions-service
  labels:
    app: acquisitions
spec:
  # ClusterIP: Tiêu chuẩn cho Production (được Ingress Controller trỏ tới)
  # Đổi thành LoadBalancer nếu bạn dùng Cloud Managed K8s và muốn cấp Public IP trực tiếp
  type: ClusterIP
  selector:
    app: acquisitions
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
