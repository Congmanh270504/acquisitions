name: Docker Build and Push

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/acquisitions
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest
            type=raw,value=prod-{{date 'YYYYMMDD-HHmmss'}}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append GitHub Summary
        if: always()
        run: |
          echo "## 🐳 Docker Build & Push Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ secrets.DOCKER_USERNAME }}/acquisitions\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Published Tags:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy to Kubernetes
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Check Kubeconfig Secret
        id: check_kube
        run: |
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "has_kube=true" >> $GITHUB_OUTPUT
          else
            echo "has_kube=false" >> $GITHUB_OUTPUT
            echo "## ⚠️ Kubernetes Deploy Notice" >> $GITHUB_STEP_SUMMARY
            echo "- Secret \`KUBE_CONFIG\` chưa được cài đặt trong GitHub Repository Secrets." >> $GITHUB_STEP_SUMMARY
            echo "- Bỏ qua bước Deploy tự động. Pipeline Build & Push image vẫn thành công." >> $GITHUB_STEP_SUMMARY
          fi

      - name: Set Kubernetes Context
        if: steps.check_kube.outputs.has_kube == 'true'
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Deploy to K8s Cluster
        if: steps.check_kube.outputs.has_kube == 'true'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          IMAGE_TAG: sha-${{ github.sha }}
        run: |
          echo "🚀 Bắt đầu quá trình Deploy lên Kubernetes..."

          # 0. Cấu hình và Apply ClusterIssuer (nếu có LETSENCRYPT_EMAIL trong GitHub Secrets)
          if [ -n "$LETSENCRYPT_EMAIL" ] && [ -f "k8s/cluster-issuer.yaml" ]; then
            sed -i "s|\${LETSENCRYPT_EMAIL}|$LETSENCRYPT_EMAIL|g" k8s/cluster-issuer.yaml
            kubectl apply -f k8s/cluster-issuer.yaml
          fi

          # 1. Cấu hình Docker Hub Registry Secret (hỗ trợ kéo private repo)
          if [ -n "$DOCKER_USERNAME" ] && [ -n "$DOCKER_PASSWORD" ]; then
            kubectl create secret docker-registry dockerhub-secret \
              --docker-server=https://index.docker.io/v1/ \
              --docker-username="$DOCKER_USERNAME" \
              --docker-password="$DOCKER_PASSWORD" \
              --dry-run=client -o yaml | kubectl apply -f -
          fi

          # 2. Apply ConfigMap
          kubectl apply -f k8s/configmap.yaml

          # 3. Tạo hoặc cập nhật Secret an toàn nếu có DATABASE_URL trong GitHub Secrets
          if [ -n "$DATABASE_URL" ]; then
            kubectl create secret generic acquisitions-secret \
              --from-literal=DATABASE_URL="$DATABASE_URL" \
              --dry-run=client -o yaml | kubectl apply -f -
          elif [ -f "k8s/secret.yaml" ]; then
            kubectl apply -f k8s/secret.yaml
          fi

          # 4. Apply Service
          kubectl apply -f k8s/service.yaml

          # 5. Apply Ingress
          if [ -f "k8s/ingress.yaml" ]; then
            kubectl apply -f k8s/ingress.yaml
          fi

          # 6. Thay thế image tag mới nhất và Apply Deployment
          sed -i "s|cmanh2705/acquisitions:latest|$DOCKER_USERNAME/acquisitions:$IMAGE_TAG|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml

          # 7. Kiểm tra trạng thái rollout
          kubectl rollout status deployment/acquisitions-deployment --timeout=180s

          echo "## 🚀 Kubernetes Deploy Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Deployed:** \`$DOCKER_USERNAME/acquisitions:$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ✅ Successfully rolled out to cluster" >> $GITHUB_STEP_SUMMARY

      - name: Debug Pod Failure
        if: failure() && steps.check_kube.outputs.has_kube == 'true'
        run: |
          echo "=============================================="
          echo "❌ ROLLOUT THẤT BẠI - BẮT ĐẦU CHẨN ĐOÁN LỖI"
          echo "=============================================="
          echo "1. Danh sách Pods và Trạng thái:"
          kubectl get pods -l app=acquisitions -o wide
          echo ""
          echo "2. Chi tiết sự kiện (Events & Errors):"
          kubectl describe pods -l app=acquisitions
          echo ""
          echo "3. Nhật ký Logs của Container:"
          kubectl logs -l app=acquisitions --tail=100 --all-containers=true || true
