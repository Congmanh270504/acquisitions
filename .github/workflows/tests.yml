name: Tests

on:
  push:
    branches:
      - main
      - staging
  pull_request:
    branches:
      - main
      - staging

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: --experimental-vm-modules
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgres://user:password@localhost:5432/dbname' }}
        run: npm test

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Generate GitHub Step Summary
        if: always()
        run: |
          echo "## 📊 Test & Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          if [ -d "coverage" ]; then
            echo "- **Coverage Reports:** Generated and retained for 30 days as artifact." >> $GITHUB_STEP_SUMMARY
            if [ -f "coverage/index.html" ]; then
              echo "- **HTML Report:** Available in artifact." >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "- **Coverage Reports:** No coverage folder found." >> $GITHUB_STEP_SUMMARY
          fi
